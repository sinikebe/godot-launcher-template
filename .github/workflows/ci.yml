name: CI

# Pull-request validation: exports exactly the way release.yml does, so an
# export that would break the release is caught before merge.
#
# This workflow never touches a secret and never publishes anything, which is
# what makes it safe to run on pull requests from forks.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable

jobs:
  build:
    name: Export check
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the translation template is current
        # The .pot is committed because Godot 4.7 cannot generate one headlessly,
        # so nothing would otherwise notice a tr() added without regenerating it --
        # and a string missing from the template is a string no translator ever
        # sees. Regenerate and diff rather than trust.
        run: python3 ci/make_pot.py --check

      - name: Run the unit tests
        # ci/make_manifest.py builds what every player's app reads, and nothing
        # else here runs it before a release does. Standard library only, so no
        # install step; see ci/tests/.
        run: python3 -B -m unittest discover -s ci/tests -v

      - name: Check launcher code still runs on older binaries
        # A content pack carries this launcher to every binary the game ever
        # shipped, but BuildInfo and LauncherConfig stay at the binary's version.
        # A direct read of a member an older one lacks breaks it at runtime, in
        # #70's case the updater itself, beyond repair from inside the app. Reads
        # the whole history, which is why the checkout above is fetch-depth: 0.
        run: python3 ci/check_binary_skew.py

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-verified-v1

      - name: Install Godot
        run: bash ci/install_godot.sh

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Collect patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/collect_changes.sh

      - name: Stamp build version
        id: version
        run: bash ci/prepare_build.sh

      - name: Resolve throwaway signing key
        id: keystore
        # No secret is passed, so this always generates a one-off debug key.
        # Signature stability does not matter for a check that ships nothing.
        run: bash ci/setup_keystore.sh

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Check for script and scene errors
        # Loads every autoload and the main scene, then quits. Any parse error,
        # bad preload or broken scene reference fails the job here.
        run: ~/godot/godot --headless --path . --quit-after 120

      - name: Run the launcher's GDScript tests
        # The changelog formatter and the staged-pack mount guards decide what a
        # player is shown and which content they run, and the boot check above
        # only proves they parse. These tests drive the real autoloads. A scratch
        # HOME keeps user:// away from anything the boot check just wrote. The
        # script prints its own tally because a Godot exit code is not trusted to
        # mean "no script errors" (#71), so the step also fails on any SCRIPT
        # ERROR line and on a tally that is missing or not zero-failed. See
        # ci/tests/run_gd_tests.gd.
        run: |
          out="$(HOME="$(mktemp -d)" ~/godot/godot --headless --path . --script ci/tests/run_gd_tests.gd 2>&1)" || { echo "$out"; exit 1; }
          echo "$out"
          if grep -q 'SCRIPT ERROR' <<<"$out"; then echo "::error::a SCRIPT ERROR was logged"; exit 1; fi
          grep -qE '^[0-9]+ checks, 0 failed$' <<<"$out"

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/${{ steps.version.outputs.apk_name }}

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/${{ steps.version.outputs.exe_name }}

      - name: Export content packs
        # Same two packs release.yml publishes, under the same names, so this check
        # exercises what actually ships. The desktop pack is not named for Windows:
        # the Windows, Linux and macOS presets produce a byte-identical pack, and
        # release.yml publishes this one file under all three desktop keys.
        run: |
          mkdir -p build/content
          ~/godot/godot --headless --path . --export-pack "Android" build/content/content-android.pck
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/content/content-desktop.pck

      - name: Rehearse the release assembly and publish script
        # Until this step, nothing on a pull request ran the end of release.yml:
        # assembling the release directory, building manifest.json, and the publish
        # script. This runs them against what the export steps above just produced,
        # with a stand-in for gh, so a broken artifact name, an unreadable manifest
        # or a publish script that fails shows up here and not on a merge to main.
        # Nothing is published and no token is used. See ci/release_dry_run.sh.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GAME_NAME: ${{ steps.version.outputs.game_name }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
          BINARY_VERSION: ${{ steps.version.outputs.binary_version }}
          CONTENT_VERSION: ${{ steps.version.outputs.content_version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
          SIGNING_KIND: ${{ steps.keystore.outputs.kind }}
        run: bash ci/release_dry_run.sh

      - name: Check the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning ci/*.sh


      - name: Upload build for inspection
        uses: actions/upload-artifact@v7
        with:
          name: build-pr-${{ github.event.pull_request.number || github.run_id }}
          path: |
            build/android/${{ steps.version.outputs.apk_name }}
            build/windows/${{ steps.version.outputs.exe_name }}
            build/content/*.pck
          if-no-files-found: error
          retention-days: 7
