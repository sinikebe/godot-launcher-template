name: Release

# Builds the Android APK, the Windows executable and the per-platform content
# packs, then publishes them as a GitHub release together with the manifest the
# in-app updater polls.
#
# Runs on merges to main, on pushes to a branch that publishes its own rolling
# prerelease, and on manual dispatch. Pull requests are handled by ci.yml, which
# builds the same way but never sees a secret and never publishes -- so a fork PR
# cannot reach the signing key.
#
# A push to any branch below other than main publishes to that branch's own
# rolling tag as a prerelease, which /releases/latest/ never returns. Add or
# rename branches here to suit the game; `dev` is only the conventional one.
# A build follows such a branch because it was exported for it -- the stamp that
# gives it its own package id and user:// is the same one that decides what it
# polls -- so nothing built for main can reach it.
#
# Two repository variables (Settings -> Secrets and variables -> Actions ->
# Variables) change where it runs and publishes, with no edit to this file -- an
# edit would show up as drift on every launcher sync:
#   RELEASE_REPO    owner/name of a separate public repository that holds only
#                   releases, for a game whose code is private. Needs the
#                   RELEASE_TOKEN secret. Unset publishes here.
#   RELEASE_RUNNER  the runner label this job runs on, on a private repository
#                   only. Unset is ubuntu-latest.
# See docs/UPDATES.md, "Publishing from a private repository" and "Running the
# workflows on your own machine".

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

# Read-only by default; the publish job opts into the one extra scope it needs.
permissions:
  contents: read

# Per-ref, so a push to a branch's rolling release does not queue behind a
# release to main. Still never cancelled: two runs publishing to the same tag
# would race on its assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable
  # Empty on the repo's default branch, which is what makes a release a release:
  # prepare_build.sh and publish_release.sh both behave exactly as they always did
  # when it is unset.
  #
  # Compared against the repository's actual default branch rather than the
  # literal "main". A game that renames its release branch edits the list above --
  # the docs tell it to -- and with a literal here every release from `master` or
  # `trunk` would then publish as a prerelease under a branch tag, with a branch
  # package id: /releases/latest/ would return nothing, every installed build would
  # stop updating, and the new APK could no longer install over the old one.
  #
  # Written as `!= default && ref_name || ''` rather than the other way round
  # because an empty string is falsy to Actions, so `== default && '' || ref_name`
  # would fall through and hand every release the branch path.
  #
  # Passed as an environment variable, never interpolated into a `run:` block: a
  # branch name is attacker-controllable on a fork and `${{ }}` is substituted
  # into the script before bash parses it. prepare_build.sh validates the value
  # and refuses anything outside [A-Za-z0-9._-].
  RELEASE_BRANCH: ${{ github.ref_name != github.event.repository.default_branch && github.ref_name || '' }}
  # Where the release is published. Every script reads it from here, and each one
  # treats unset as this repository, so a script synced into a game whose workflow
  # predates it publishes exactly as before.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  release:
    name: Build and publish
    # Private repositories only: a self-hosted runner registered on a public one
    # can be named by any pull request's own copy of a workflow.
    runs-on: ${{ github.event.repository.private && vars.RELEASE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write # create the release and upload its assets

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # content_version is the commit count, so the full history is required.
          fetch-depth: 0
          # Nothing here authenticates with git: publishing goes through gh. Left
          # in .git/config, the write token would be readable by every later step.
          persist-credentials: false

      - name: Check the release repository
        # First, so a missing token or an unusable releases repository fails in
        # seconds rather than after every export. Nothing to check, and nothing
        # called, when releases are published here.
        env:
          GH_TOKEN: ${{ vars.RELEASE_REPO && vars.RELEASE_REPO != github.repository && secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TOKEN_SET: ${{ secrets.RELEASE_TOKEN != '' }}
        run: bash ci/check_release_repo.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        # Pinned to a commit: a third-party action runs as this job, before the steps
        # that hold the signing key and, in release.yml, RELEASE_TOKEN.
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Cache Godot editor and export templates
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-verified-v1

      - name: Install Godot
        run: bash ci/install_godot.sh

      - name: Point Godot at the Android SDK
        # Godot reads these from its editor settings only -- it has no env-var
        # fallback -- and refuses to export for Android without them.
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Collect patch notes
        env:
          # Reads the latest release's manifest, from RELEASE_REPO.
          GH_TOKEN: ${{ vars.RELEASE_REPO && vars.RELEASE_REPO != github.repository && secrets.RELEASE_TOKEN || github.token }}
        # Must run before the version stamp: prepare_build.sh bakes these notes
        # into the binary so the app can show its own changelog with no network.
        run: bash ci/collect_changes.sh

      - name: Stamp build version
        id: version
        run: bash ci/prepare_build.sh

      - name: Restore signing keystore cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/launcher-keystore-cache
          key: launcher-debug-keystore-v1

      - name: Resolve signing key
        id: keystore
        env:
          # Absent on a repo with no signing secrets configured; setup_keystore.sh
          # then falls back to a cached debug key and says so in the job summary.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_CACHE_DIR: ${{ runner.temp }}/launcher-keystore-cache
          GAME_NAME: ${{ steps.version.outputs.game_name }}
        run: bash ci/setup_keystore.sh

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export Android APK
        env:
          # Godot reads the keystore from these; the passwords come straight from
          # the secrets context, which Actions masks in logs. They are never
          # written to a file, an output, or $GITHUB_ENV.
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ steps.keystore.outputs.path }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/${{ steps.version.outputs.apk_name }}
          # Godot leaves an APK Signature Scheme v4 sidecar next to the APK that
          # is not part of the distribution.
          rm -f build/android/${{ steps.version.outputs.apk_name }}.idsig

      - name: Verify APK signature
        run: |
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT}/build-tools" -maxdepth 1 -type d -name '3*' | sort -V | tail -1)"
          "${BUILD_TOOLS}/apksigner" verify --print-certs build/android/${{ steps.version.outputs.apk_name }}

      - name: Export Windows executable
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/${{ steps.version.outputs.exe_name }}

      - name: Export content packs
        # Two packs, split by texture compression rather than by OS: mobile needs
        # ETC2, desktop needs S3TC/BPTC, so one shared pack would ship the wrong
        # format to one of them.
        #
        # Desktop is one pack for all three desktops. Measured with a
        # VRAM-compressed texture: the packs from the Windows, Linux and macOS
        # presets are byte-identical -- each carries the same .s3tc.ctex variant --
        # while the Android pack carries .etc2.ctex and differs. So the file is
        # named for the family it serves, not for Windows, and is published under
        # every desktop platform key the launcher can ask for.
        #
        # That identity holds while the desktop presets agree on their
        # texture_format/* flags and custom_features. A game that adds a macOS
        # preset with etc2_astc, or a Linux preset with its own custom_features,
        # breaks it and would be publishing the wrong bytes under those keys --
        # nothing here would notice. This repository defines no Linux or macOS
        # preset, so there is nothing to diverge; a game that adds one should
        # diff its pack against this one.
        run: |
          mkdir -p build/content
          ~/godot/godot --headless --path . --export-pack "Android" build/content/content-android.pck
          ~/godot/godot --headless --path . --export-pack "Windows Desktop" build/content/content-desktop.pck

      - name: Assemble release directory
        run: |
          mkdir -p build/release
          cp build/android/${{ steps.version.outputs.apk_name }} build/release/
          cp build/windows/${{ steps.version.outputs.exe_name }} build/release/
          cp build/content/content-android.pck build/release/
          cp build/content/content-desktop.pck build/release/

      - name: Build update manifest
        run: |
          python3 ci/make_manifest.py \
            --changes-file build/notes/changes.json \
            --previous-manifest build/notes/previous.json \
            --repo "${RELEASE_REPO}" \
            --version-name "${{ steps.version.outputs.version_name }}" \
            --binary-version "${{ steps.version.outputs.binary_version }}" \
            --content-version "${{ steps.version.outputs.content_version }}" \
            --commit "${{ steps.version.outputs.commit }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --artifact "binary:android:build/release/${{ steps.version.outputs.apk_name }}" \
            --artifact "binary:windows:build/release/${{ steps.version.outputs.exe_name }}" \
            --artifact "content:android:build/release/content-android.pck" \
            --artifact "content:windows:build/release/content-desktop.pck" \
            --artifact "content:linux:build/release/content-desktop.pck" \
            --artifact "content:macos:build/release/content-desktop.pck" \
            --out build/release/manifest.json

      - name: Publish release
        env:
          # github.token can write only to this repository; RELEASE_TOKEN is the
          # one that reaches a separate RELEASE_REPO.
          GH_TOKEN: ${{ vars.RELEASE_REPO && vars.RELEASE_REPO != github.repository && secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GAME_NAME: ${{ steps.version.outputs.game_name }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          EXE_NAME: ${{ steps.version.outputs.exe_name }}
          BINARY_VERSION: ${{ steps.version.outputs.binary_version }}
          CONTENT_VERSION: ${{ steps.version.outputs.content_version }}
          SIGNING_KIND: ${{ steps.keystore.outputs.kind }}
        run: bash ci/publish_release.sh

      - name: Shred the signing key
        # Removed explicitly so it cannot survive into any later step of this job.
        # GitHub's machines are thrown away after the job; on a self-hosted runner
        # nothing else guarantees it.
        if: always()
        run: |
          find "${RUNNER_TEMP}/launcher-signing" -type f -exec shred -u {} + 2>/dev/null || true
          rm -rf "${RUNNER_TEMP}/launcher-signing"
