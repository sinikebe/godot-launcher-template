name: Sync launcher

# Pulls launcher updates from the template repository into this game.
#
# Opens a pull request and stops there -- it never merges. Merging main in a
# consuming game publishes a release to players, so deciding a launcher change
# is safe to ship is the game developer's call. Do not add a merge step here.
#
# Two jobs, because the check runs code nobody has reviewed yet: the template's
# ci/*.sh, its launcher, and the Godot its install script fetches. That job can
# only read this repository. The job that pushes and opens the pull request runs
# none of it. Keep it that way; see README.md, "What a sync trusts".

on:
  schedule:
    # Daily. Adjust freely -- the job is a no-op when nothing has changed.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Template branch or tag to sync from (blank: the LAUNCHER_TEMPLATE_REF variable, or main)"
        required: false

permissions:
  contents: read

concurrency:
  group: sync-launcher
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable
  LAUNCHER_TEMPLATE_REPO: sinikebe/godot-launcher-template
  # A branch or a tag. Set the LAUNCHER_TEMPLATE_REF repository variable to a
  # tag to stay on it until you change the variable, with no edit here.
  LAUNCHER_TEMPLATE_REF: ${{ inputs.ref || vars.LAUNCHER_TEMPLATE_REF || 'main' }}
  # Where release.yml publishes, so the build stamp below checks the same thing.
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}

jobs:
  check:
    name: Sync and check
    # Always GitHub's machine, never one of your own: this job runs the scripts
    # it has just pulled from the template before anyone has reviewed them.
    runs-on: ubuntu-latest
    # Skip inside the template itself, which would otherwise sync from its own
    # HEAD and open a pull request against itself. Change this alongside
    # LAUNCHER_TEMPLATE_REPO if you maintain your own fork of the template.
    if: github.repository != 'sinikebe/godot-launcher-template'
    # Read-only, so a hostile template commit cannot push, publish or open
    # anything from here. Never give this job a write scope or a secret.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      commit: ${{ steps.sync.outputs.commit }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Nothing here pushes, and a token left in .git/config is readable by
          # every step after this one.
          persist-credentials: false

      - name: Sync launcher
        id: sync
        # From a copy: the sync overwrites ci/sync_launcher.sh while it runs.
        run: |
          cp ci/sync_launcher.sh "${RUNNER_TEMP}/sync_launcher.sh"
          bash "${RUNNER_TEMP}/sync_launcher.sh"

      - name: Anything to do?
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Launcher already up to date."
          fi

      - name: Restore cached Godot
        if: steps.diff.outputs.changed == 'true'
        # Restore only. A cache saved at the end of this job would hold whatever
        # the template's install script left in ~/godot, under the key that
        # release.yml restores and runs with your signing key.
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux-verified-v1

      - name: Install Godot
        if: steps.diff.outputs.changed == 'true'
        run: bash ci/install_godot.sh

      - name: Check the project still loads
        # A pull request opened by GITHUB_TOKEN does not trigger other workflows,
        # so the PR would otherwise arrive with no checks at all. Import and boot
        # the project here instead: that catches the realistic breakage, a
        # launcher change the game's config or autoloads no longer satisfy.
        # What it stamps or builds stays on this machine: the pull request is
        # made from a fresh checkout in the job below.
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash ci/collect_changes.sh || true
          bash ci/prepare_build.sh
          ~/godot/godot --headless --path . --import
          # A scratch HOME, as in ci.yml's boot check, so user:// starts empty.
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          HOME="$scratch" XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config" XDG_CACHE_HOME="$scratch/cache" \
            ~/godot/godot --headless --path . --quit-after 120

  pull-request:
    name: Open pull request
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # The only job that can write, and it runs nothing the template supplies:
    # this repository's own ci/sync_launcher.sh, which only copies files, then
    # git and gh. Never add a step here that runs ci/*.sh after the sync, the
    # project, or Godot. That belongs in the check job above.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Sync launcher
        id: sync
        # The same script the check job ran, from the same commit of this
        # repository, so it copies the same files.
        run: |
          cp ci/sync_launcher.sh "${RUNNER_TEMP}/sync_launcher.sh"
          bash "${RUNNER_TEMP}/sync_launcher.sh"

      - name: Is this what was checked?
        id: checked
        env:
          CHECKED: ${{ needs.check.outputs.commit }}
          SYNCED: ${{ steps.sync.outputs.commit }}
        run: |
          if [[ -z "$SYNCED" || "$SYNCED" != "$CHECKED" ]]; then
            echo "::warning::The template moved from ${CHECKED:0:8} to ${SYNCED:0:8} after the check, so no pull request was opened. The next run checks the new commit."
          elif [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing left to change: the launcher was brought up to date after the check."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.checked.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: launcher-sync
          BASE: ${{ github.event.repository.default_branch }}
          # Everything below comes from the TEMPLATE repository, not this one:
          # SUBJECT is its HEAD commit subject, WORKFLOW_DRIFT and
          # WORKFLOW_MISSING are lists of its workflow filenames. A `${{ }}` is
          # substituted into the script as text before bash parses it, so
          # interpolating any of them directly would let a commit subject or a
          # filename run commands here -- with this job's contents:write and
          # pull-requests:write. Passed as env instead, they arrive as inert
          # values that are never re-parsed.
          #
          # That rule covers this boundary only. It stops a hostile value being
          # parsed as shell here; it does nothing about the value being created
          # in the first place. A step output is written as `key=value` lines
          # that the runner parses line by line, so a newline inside a value
          # forges further outputs -- including an empty workflow_drift, which
          # would erase the very warning below. ci/sync_launcher.sh closes that
          # end twice over: an allowlist admitting only names the runner and a
          # markdown renderer leave alone, and a heredoc delimiter on every
          # output so that a newline in any value is contained rather than read
          # as the start of another key.
          SHORT_COMMIT: ${{ steps.sync.outputs.short_commit }}
          COMMIT: ${{ steps.sync.outputs.commit }}
          SUBJECT: ${{ steps.sync.outputs.subject }}
          WORKFLOW_DRIFT: ${{ steps.sync.outputs.workflow_drift }}
          WORKFLOW_MISSING: ${{ steps.sync.outputs.workflow_missing }}
          WORKFLOW_REJECTED: ${{ steps.sync.outputs.workflow_rejected }}
          # GitHub-controlled and not attacker-influenced, but routed the same
          # way so the rule stays one a reviewer can check by eye: no `${{ }}`
          # anywhere inside a `run:` block.
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Sync launcher from template @ $SHORT_COMMIT

          $SUBJECT

          Source: ${LAUNCHER_TEMPLATE_REPO}@$COMMIT"
          git push -f origin "$BRANCH"

          BODY="Pulls \`addons/launcher/\` and \`ci/\` from [\`${LAUNCHER_TEMPLATE_REPO}\`](https://github.com/${LAUNCHER_TEMPLATE_REPO}) at \`$SHORT_COMMIT\`.

          > $SUBJECT

          Before this pull request was opened, a separate job with read-only access synced the same commit and imported and booted the project headless.

          **Review before merging** -- merging publishes a release to players."

          # Two categories, reported separately. A workflow that is new upstream
          # and absent here cannot be noticed any other way -- there is no local
          # file to compare against, and nothing on disk to look at.
          if [[ -n "$WORKFLOW_DRIFT$WORKFLOW_MISSING" ]]; then
            DRIFT_LIST=""
            if [[ -n "$WORKFLOW_DRIFT" ]]; then
              DRIFT_LIST="${DRIFT_LIST}
          - Changed upstream: \`$WORKFLOW_DRIFT\`"
            fi
            if [[ -n "$WORKFLOW_MISSING" ]]; then
              DRIFT_LIST="${DRIFT_LIST}
          - New upstream, not present here: \`$WORKFLOW_MISSING\`"
            fi
            BODY="$BODY

          ---
          **These workflows must be copied by hand.** A token scoped to \`contents\` cannot write \`.github/workflows/\`, so the sync leaves them alone.
          ${DRIFT_LIST}"
          fi

          # Its own block, not a bullet in the list above: a rejected filename is
          # not a workflow to copy, and folding it in produced a "copy these by
          # hand" heading over an empty list whenever it was the only finding.
          # Never named -- the filename is the hostile part; the count is all a
          # human needs to know something is wrong upstream.
          if [[ -n "$WORKFLOW_REJECTED" && "$WORKFLOW_REJECTED" != "0" ]]; then
            BODY="$BODY

          ---
          > [!WARNING]
          > **$WORKFLOW_REJECTED upstream workflow filename(s) are not plain names** and are not
          > listed here. A workflow filename has no reason to contain a control character, a
          > backtick or a percent escape -- treat this as a sign that the template repository
          > has been tampered with."
          fi

          TITLE="Sync launcher @ $SHORT_COMMIT"

          # Match only OPEN pull requests. `gh pr view <branch>` also resolves
          # merged and closed ones, so once the first sync PR was merged every
          # later run would quietly re-title that dead PR and never open a new
          # one -- leaving the branch pushed with nothing to review.
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          elif OUTPUT="$(gh pr create --head "$BRANCH" --base "$BASE" --title "$TITLE" --body "$BODY" 2>&1)"; then
            # Echoed back rather than streamed, because the failure branch below
            # needs this text for the run summary -- and `gh pr create` prints
            # the new pull request's URL on stdout, so capturing it without
            # echoing would lose that from the log on the path that works.
            printf '%s\n' "$OUTPUT"
          else
            printf '%s\n' "$OUTPUT" >&2

            # An open pull request appearing between the `gh pr list` above and
            # this create is a benign race -- a human opened it by hand in that
            # window. The end state is the one this step wanted, so it is not a
            # failure; it is also not the permission refusal, so without its own
            # branch it would turn a daily sync red for having succeeded.
            # `concurrency` stops two runs overlapping, but not a person.
            if [[ "${OUTPUT,,}" == *"already exists"* ]]; then
              echo "::notice::A pull request for $BRANCH already exists; nothing to open."
              exit 0
            fi

            {
              echo "### Launcher synced, but the pull request could not be opened"
              echo ""
              echo "The branch \`$BRANCH\` is pushed, so the sync itself succeeded. Open the"
              echo "pull request by hand:"
              echo ""
              echo "$SERVER_URL/$REPOSITORY/compare/$BASE...$BRANCH?expand=1"
              echo ""
              echo "\`gh pr create\` reported:"
              echo ""
              # Indented, not fenced. This is text from GitHub's API, and a line
              # of ``` inside it would close a fence -- after which the rest
              # renders as markdown, in a summary a maintainer is reading to find
              # out what went wrong. An indented code block cannot be closed from
              # within. The blank line above is what makes it one.
              if [[ -n "$OUTPUT" ]]; then
                printf '%s\n' "$OUTPUT" | sed 's/^/    /'
              else
                echo "    (no output)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            # One cause is expected and benign: the repository has "Allow GitHub
            # Actions to create and approve pull requests" off, which is the
            # default. That is a settings choice, not a broken sync, and not
            # failing the job over it is what efbab66 set out to do.
            #
            # Everything else -- a bad base ref, a malformed request, an outage
            # that began after the `gh pr list` above -- is a real failure, and a
            # scheduled workflow notifies nobody unless it fails. This used to
            # report every one of them as the permission setting and exit 0, so a
            # genuinely broken daily sync stayed green with a summary pointing at
            # the wrong fix. (The `gh pr edit` branch above never had that
            # problem: the same error there has always failed the job.)
            #
            # The match decides only whether to stay green, never what is
            # reported -- the real message is already in the log and the summary
            # above either way. So if that wording ever drifts, a refusal starts
            # failing the job with an accurate message rather than being filed
            # under the wrong cause. Wrong in the safe direction.
            if [[ "${OUTPUT,,}" == *"not permitted to create"* ]]; then
              {
                echo ""
                echo "That is the **Allow GitHub Actions to create and approve pull requests**"
                echo "setting, under Settings -> Actions -> General. Turn it on and the next"
                echo "sync opens the pull request itself."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$BRANCH is pushed, but this repository does not allow Actions to open pull requests. Open it by hand."
            else
              echo "::error::$BRANCH is pushed, but opening the pull request failed. See the run summary."
              exit 1
            fi
          fi
