name: Sync launcher

# Pulls launcher updates from the template repository into this game.
#
# Opens a pull request and stops there -- it never merges. Merging main in a
# consuming game publishes a release to players, so deciding a launcher change
# is safe to ship is the game developer's call. Do not add a merge step here.

on:
  schedule:
    # Daily. Adjust freely -- the job is a no-op when nothing has changed.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Template ref to sync from"
        default: main
        required: false

permissions:
  contents: read

concurrency:
  group: sync-launcher
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: stable
  LAUNCHER_TEMPLATE_REPO: sinikebe/godot-launcher-template
  LAUNCHER_TEMPLATE_REF: ${{ inputs.ref || 'main' }}

jobs:
  sync:
    name: Sync from template
    runs-on: ubuntu-latest
    # Skip inside the template itself, which would otherwise sync from its own
    # HEAD and open a pull request against itself. Change this alongside
    # LAUNCHER_TEMPLATE_REPO if you maintain your own fork of the template.
    if: github.repository != 'sinikebe/godot-launcher-template'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync launcher
        id: sync
        # From a copy: the sync overwrites ci/sync_launcher.sh while it runs.
        run: |
          cp ci/sync_launcher.sh "${RUNNER_TEMP}/sync_launcher.sh"
          bash "${RUNNER_TEMP}/sync_launcher.sh"

      - name: Anything to do?
        id: diff
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Launcher already up to date."
          fi

      - name: Cache Godot
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-linux

      - name: Install Godot
        if: steps.diff.outputs.changed == 'true'
        run: bash ci/install_godot.sh

      - name: Check the project still loads
        # A pull request opened by GITHUB_TOKEN does not trigger other workflows,
        # so the PR would otherwise arrive with no checks at all. Import and boot
        # the project here instead: that catches the realistic breakage, a
        # launcher change the game's config or autoloads no longer satisfy.
        if: steps.diff.outputs.changed == 'true'
        run: |
          bash ci/collect_changes.sh || true
          bash ci/prepare_build.sh
          ~/godot/godot --headless --path . --import
          ~/godot/godot --headless --path . --quit-after 120
          # prepare_build.sh stamps generated values; keep them out of the PR.
          git checkout -- build_version.gd export_presets.cfg 2>/dev/null || true
          git clean -fd build 2>/dev/null || true

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: launcher-sync
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "Sync launcher from template @ ${{ steps.sync.outputs.short_commit }}

          ${{ steps.sync.outputs.subject }}

          Source: ${LAUNCHER_TEMPLATE_REPO}@${{ steps.sync.outputs.commit }}"
          git push -f origin "$BRANCH"

          BODY="Pulls \`addons/launcher/\` and \`ci/\` from [\`${LAUNCHER_TEMPLATE_REPO}\`](https://github.com/${LAUNCHER_TEMPLATE_REPO}) at \`${{ steps.sync.outputs.short_commit }}\`.

          > ${{ steps.sync.outputs.subject }}

          The project was imported and booted headless on this branch before the PR was opened.

          **Review before merging** -- merging publishes a release to players."

          if [[ -n "${{ steps.sync.outputs.workflow_drift }}" ]]; then
            BODY="$BODY

          ---
          **These workflows also changed upstream and must be copied by hand:** \`${{ steps.sync.outputs.workflow_drift }}\`
          A token scoped to \`contents\` cannot write \`.github/workflows/\`, so the sync leaves them alone."
          fi

          TITLE="Sync launcher @ ${{ steps.sync.outputs.short_commit }}"

          # Match only OPEN pull requests. `gh pr view <branch>` also resolves
          # merged and closed ones, so once the first sync PR was merged every
          # later run would quietly re-title that dead PR and never open a new
          # one -- leaving the branch pushed with nothing to review.
          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"

          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
          elif ! gh pr create --head "$BRANCH" --base "$BASE" --title "$TITLE" --body "$BODY"; then
            # Opening a PR needs "Allow GitHub Actions to create and approve pull
            # requests" (Settings -> Actions -> General), which is off by default.
            # The branch is pushed either way, so report how to finish by hand
            # rather than failing a job that did its actual work.
            {
              echo "### Launcher synced, but the pull request could not be opened"
              echo ""
              echo "Enable **Allow GitHub Actions to create and approve pull requests**"
              echo "under Settings -> Actions -> General, or open it yourself:"
              echo ""
              echo "${{ github.server_url }}/${{ github.repository }}/compare/$BRANCH?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Branch $BRANCH is pushed; PR creation was refused."
          fi
